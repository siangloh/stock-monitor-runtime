name: Five-minute paper research
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'tick = paper monitoring; train = initialize timing models'
        type: choice
        options: [tick, train]
        default: tick
      handoff_test:
        description: 'Maintenance: one-minute worker then normal successor'
        type: boolean
        default: false
  schedule:
    # A running worker checks every five minutes; hourly triggers request a successor.
    - cron: '17 * * * 1-5'
    # Weekend evening coverage for the MYT daily digest.
    - cron: '17 12,13 * * 0,6'
permissions:
  contents: read
  actions: write
concurrency:
  group: shared-private-paper-account
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: siangloh/stock-monitor-ai
          ref: main
          path: source
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Weekly dependency-cache version
        id: epoch
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: dependencies
        with:
          path: |
            .runtime-venv
            ~/.cache/huggingface
          key: minute-runtime-${{ runner.os }}-${{ steps.epoch.outputs.week }}-${{ hashFiles('source/requirements.txt') }}
      - name: Prepare cached financial-research runtime
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: |
          python -m venv .runtime-venv
          .runtime-venv/bin/pip install -r source/requirements.txt >/dev/null
          .runtime-venv/bin/pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu >/dev/null
      - name: Five-minute worker with private persistence after every cycle
        env:
          ACTION: ${{ inputs.action || 'tick' }}
          HANDOFF_TEST: ${{ inputs.handoff_test && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd source
          git config user.name paper-runtime-bot
          git config user.email paper-runtime-bot@users.noreply.github.com
          deadline=$((SECONDS + 330 * 60))
          if [ "$HANDOFF_TEST" = true ]; then deadline=$((SECONDS + 60)); fi
          failures=0
          conflicts=0
          pending_save=0
          while true; do
            cycle_started=$SECONDS
            git fetch origin paper-state --depth=1 >cycle.log 2>&1
            git checkout origin/paper-state -- data >>cycle.log 2>&1
            rm -f work_updated.flag intraday_notify.flag nightly_notify.flag
            if [ "$ACTION" = train ]; then
              args=(--train --market ALL)
            else
              args=(--execute)
            fi
            if ../.runtime-venv/bin/python intraday.py "${args[@]}" >>cycle.log 2>&1 && ../.runtime-venv/bin/python nightly_summary.py --queue >>cycle.log 2>&1; then
              if [ -f work_updated.flag ]; then
                git worktree add --detach /tmp/private-paper-state origin/paper-state >>cycle.log 2>&1
                mkdir -p /tmp/private-paper-state/data/intraday
                cp -a data/. /tmp/private-paper-state/data/
                cp cycle.log /tmp/private-paper-state/data/intraday/latest_debug.txt
                git -C /tmp/private-paper-state add data
                pending_save=0
                if ! git -C /tmp/private-paper-state diff --cached --quiet; then
                  git -C /tmp/private-paper-state commit -m 'Update private paper research state' >>cycle.log 2>&1
                  if ! git -C /tmp/private-paper-state push origin HEAD:paper-state >>cycle.log 2>&1; then
                    pending_save=1
                    echo '::warning::State push failed; discarded cycle will be recomputed from remote state.'
                    conflicts=$((conflicts + 1))
                  fi
                fi
                git worktree remove --force /tmp/private-paper-state >>cycle.log 2>&1
                if [ "$pending_save" = 0 ]; then
                  echo "$(date -u +%FT%TZ) Paper cycle saved privately."
                fi
              else
                pending_save=0
                echo "$(date -u +%FT%TZ) No state update; exchange may be closed."
              fi
            else
              failures=$((failures + 1))
              echo '::warning::Private analysis failed; no cycle state was published. Will retry next cycle.'
              if [ "$failures" = 1 ]; then
                git worktree add --detach /tmp/private-paper-state origin/paper-state >>cycle.log 2>&1
                mkdir -p /tmp/private-paper-state/data/intraday
                cp cycle.log /tmp/private-paper-state/data/intraday/latest_debug.txt
                STATE_ROOT=/tmp/private-paper-state ../.runtime-venv/bin/python - <<'PY'
          import json, os, uuid
          from pathlib import Path
          message = '盘中模拟监控异常 / PAPER ONLY\n本轮分析失败，未提交本轮账户变化；稍后自动重试。请勿将旧报告视为在线证明。\n无银行或券商连接。'
          p = Path(os.environ['STATE_ROOT']) / 'data/intraday/pending_notification.json'
          p.write_text(json.dumps({'id': str(uuid.uuid4()), 'text': message}, ensure_ascii=False), encoding='utf-8')
          PY
                git -C /tmp/private-paper-state add data/intraday/latest_debug.txt data/intraday/pending_notification.json
                git -C /tmp/private-paper-state commit -m 'Record private paper monitoring failure' >>cycle.log 2>&1
                if ! git -C /tmp/private-paper-state push origin HEAD:paper-state >>cycle.log 2>&1; then
                  echo '::warning::Concurrent state change prevented saving the error notification.'
                fi
                git worktree remove --force /tmp/private-paper-state >>cycle.log 2>&1
              fi
            fi
            if [ "$ACTION" = train ]; then
              test "$failures" = 0 && test "$pending_save" = 0
              break
            fi
            if [ "$(../.runtime-venv/bin/python runtime_cadence.py)" = no ]; then
              echo 'Research window closed; next scheduled worker will recheck.'
              break
            fi
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then break; fi
            delay=$((300 - (SECONDS - cycle_started)))
            if [ "$delay" -lt 1 ]; then delay=1; fi
            if [ "$delay" -gt "$remaining" ]; then delay=$remaining; fi
            sleep "$delay"
          done
          echo "Worker ended after bounded runtime; analysis errors: $failures; discarded save attempts: $conflicts; unresolved save: $pending_save" >> "$GITHUB_STEP_SUMMARY"
          echo 'Scheduled startup remains best effort. Check private timestamps for monitoring gaps.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$ACTION" != train ] && [ "$(../.runtime-venv/bin/python runtime_cadence.py)" = yes ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/intraday.yml/dispatches" -f ref=main -f 'inputs[action]=tick'
            echo 'Requested a standard successor for the active research window.'
          fi
          test "$failures" = 0 && test "$pending_save" = 0
